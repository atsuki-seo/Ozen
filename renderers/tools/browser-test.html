<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Renderer browser test</title>
<script src="ozen-renderer.js"></script>
<script type="module">
import { runCases } from './browser-cases.mjs';
let body;
try {
  const inputs = await (await fetch('inputs.json')).json();
  body = JSON.stringify(runCases(window.OzenRenderer, inputs));
} catch (e) {
  body = JSON.stringify({ error: String(e) });
}
await fetch('result', { method: 'POST', body });
</script>
</head>
<body></body>
</html>
