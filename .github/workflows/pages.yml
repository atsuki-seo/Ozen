# SPDX-License-Identifier: MIT OR Apache-2.0
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - VERSION
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; a newer push waits for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version and commit into the page
        run: |
          mkdir -p out/site
          sed -e "s/@VERSION@/$(tr -d '[:space:]' < VERSION)/" \
              -e "s/@COMMIT@/${GITHUB_SHA::7}/" \
              site/index.html > out/site/index.html
          ! grep -q '@VERSION@\|@COMMIT@' out/site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

      - id: deployment
        uses: actions/deploy-pages@v4
