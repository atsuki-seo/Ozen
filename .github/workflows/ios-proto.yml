# SPDX-License-Identifier: MIT OR Apache-2.0
name: ios-proto

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select and check Xcode
        run: |
          want=$(awk '$1 == "xcode" { print $2 }' toolchain.txt)
          sudo xcode-select -s "/Applications/Xcode_${want}.app"
          got=$(xcodebuild -version | head -n 1)
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
          echo "$got"
          [ "$got" = "Xcode $want" ] || { echo "Xcode is '$got', toolchain.txt pins $want" >&2; exit 1; }

      - name: Install GNU tools used by the scripts
        run: |
          brew install bash coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build the static libraries and the simulator driver
        run: |
          for sdk in iphoneos iphonesimulator; do
            cmake -S proto -B "build/ios-$sdk" -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$sdk" \
              -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/ios-$sdk" -j 4 --target ozenproto_lib
          done
          cmake --build build/ios-iphonesimulator -j 4 --target ozenproto

      - name: Create the XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library build/ios-iphoneos/libozenproto.a -headers proto/include \
            -library build/ios-iphonesimulator/libozenproto.a -headers proto/include \
            -output build/OzenProto.xcframework
          (cd build && ditto -c -k --keepParent OzenProto.xcframework OzenProto.xcframework.zip)

      - name: Run the golden tests and the digest on the simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" in runtime:
                  for d in devices[runtime]:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit(0)
          sys.exit(1)')
          xcrun simctl boot "$udid"
          runner="xcrun simctl spawn $udid $PWD/build/ios-iphonesimulator/ozenproto"
          bash proto/scripts/run-golden.sh "$runner"
          mkdir -p out
          bash proto/scripts/digest.sh "$runner" > out/digest.txt
          cat out/digest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ios-digest
          path: out/digest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: build/OzenProto.xcframework.zip
