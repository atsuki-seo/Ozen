recipes:
  r:
    output: {type: Carrot}
    ingredients:
      carrot: {type: Carrot, amount: "1 pcs"}
    steps:
      - {let: cubes, do: cut, args: [carrot], named: {style: dice}}
      - {let: fried, do: fry, args: [cubes], named: {time: "10 g"}}
    result: fried
expect:
  errors:
    - {name: "TYP:dimension", at: "recipes.r.steps[1]", args: [time, Time, Mass]}
