recipes:
  r:
    output: {type: Carrot}
    ingredients:
      carrot: {type: Carrot, amount: "1 pcs"}
    steps:
      - {let: x, do: wash, args: [carrot]}
      - {let: x, do: cut, args: [x], named: {style: dice}}
    result: x
expect:
  errors:
    - {name: "NAM:rebind", at: "recipes.r.steps[1]", args: [x]}
