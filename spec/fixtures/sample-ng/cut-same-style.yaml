recipes:
  r:
    output: {type: Carrot}
    ingredients:
      carrot: {type: Carrot, amount: "1 pcs"}
    steps:
      - {let: cubes, do: cut, args: [carrot], named: {style: dice, size: "10 mm"}}
      - {let: small, do: cut, args: [cubes], named: {style: dice, size: "5 mm"}}
    result: small
expect:
  errors:
    - {name: "TYP:cutCoarser", at: "recipes.r.steps[1]", args: [dice, dice]}
