recipes:
  r:
    output: {type: Carrot}
    ingredients:
      carrot: {type: Carrot, amount: "1 pcs"}
    steps:
      - {let: a, do: wash, args: [carrot]}
      - {let: b, do: cut, args: [a], named: {style: dice}}
      - {let: c, do: cut, args: [a], named: {style: slice}}
    result: b
expect:
  errors:
    - {name: "LIN:doubleUse", at: "recipes.r.steps[2]", args: [a]}
  infos:
    - {name: "LIN:leftover", at: "recipes.r.steps[2]", args: [c]}
