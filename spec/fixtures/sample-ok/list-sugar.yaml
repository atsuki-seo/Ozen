recipes:
  sugar:
    output: {type: Stew}
    ingredients:
      carrot: {type: Carrot, amount: "1 pcs"}
      water: {type: Water, amount: "200 ml"}
    steps:
      - {let: stew, do: simmer, args: [[carrot, water]], named: {time: "10 min"}}
    result: stew
  explicit:
    output: {type: Stew}
    ingredients:
      carrot: {type: Carrot, amount: "1 pcs"}
      water: {type: Water, amount: "200 ml"}
    steps:
      - {let: both, do: combine, args: [[carrot, water]]}
      - {let: stew, do: simmer, args: [both], named: {time: "10 min"}}
    result: stew
expect:
  errors: []
  steps:
    sugar.stew:
      type: Mixture
      state: {doneness: done, prep: "[]"}
      traits: []
      amount: "348..400 g"
    explicit.stew:
      type: Mixture
      state: {doneness: done, prep: "[]"}
      traits: []
      amount: "348..400 g"
