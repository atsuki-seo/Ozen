recipes:
  r:
    output: {type: Carrot}
    ingredients:
      carrot: {type: Carrot, amount: "1 pcs"}
    steps:
      - {let: cubes, do: cut, args: [carrot], named: {style: dice}}
    result: cubes
expect:
  errors: []
  steps:
    r.cubes:
      type: Carrot
      state: {doneness: raw, browning: none, shape: "cut(style: dice, size: 3 mm)", prep: "[]"}
