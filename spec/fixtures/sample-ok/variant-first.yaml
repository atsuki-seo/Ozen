recipes:
  r:
    output: {type: CookedRice}
    ingredients:
      rice: {type: Rice, amount: "300 g"}
    steps:
      - {let: soaked, do: soak, args: [rice], named: {time: "30 min"}}
      - {let: cooked, do: cookRice, args: [soaked]}
    result: cooked
expect:
  errors: []
  infos:
    - {name: "ASM:firstVariant", at: "recipes.r.steps[1]", args: [pot, microwave]}
  requires: [Container, RiceCooking]
