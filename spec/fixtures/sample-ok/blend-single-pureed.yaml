recipes:
  r:
    output: {type: Banana}
    ingredients:
      banana: {type: Banana, amount: "1 pcs"}
    steps:
      - {let: peeled, do: peel, args: [banana]}
      - {let: puree, do: blend, args: [peeled]}
    result: puree
expect:
  errors: []
  steps:
    r.puree:
      type: Banana
      state: {shape: pureed}
