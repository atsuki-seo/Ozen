axes:
  doneness: {kind: ordered, values: [raw, done]}
  shape:
    kind: tagged
    values: [whole, peeled, cut]
    params: {cut: {style: CutStyle, size: Length}}
  prep:
    kind: set
    values: [washed, soaked]
    params: {soaked: {time: Time}}
  Browning: {kind: ordered, values: [none, light]}
  cleaning: {kind: ordered, values: [none, rinse, wash]}
enums:
  CutStyle:
    values: [slice, mince]
    finer: {slice: [mince]}
