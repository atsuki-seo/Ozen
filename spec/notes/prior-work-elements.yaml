sources:
  nakabe2021:
    title: "Optimal Cooking Procedure Presentation System for Multiple Recipes and Investigating Its Effect"
    authors: "Jin Nakabe, Teruhiro Mizumoto, Hirohiko Suwa, Keiichi Yasumoto"
    venue: "Algorithms 14(2) 67, 2021"
    url: "https://mdpi-res.com/d_attachment/algorithms/algorithms-14-00067/article_deploy/algorithms-14-00067.pdf"
    retrieved: "2026-10-26"
    sha256: 703576b3a09e2de5589053376f638c179492740464588e56b7752d21f70a541d
  tasse2008:
    title: "SOUR CREAM: Toward Semantic Processing of Recipes"
    authors: "Dan Tasse, Noah A. Smith"
    venue: "CMU-LTI-08-005, 2008"
    url: "http://www.cs.cmu.edu/~nasmith/papers/tasse+smith.tr08.pdf"
