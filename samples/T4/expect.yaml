entry: karubiDon
runs:
  - name: no-kitchen
    expect:
      errors: 0
      level: 0
      diagnostics:
        exclude: [aliasCandidates, whereUnsatisfied]
      ir:
        labels: [Karubi]
        reaches:
          - {to: plate, from: [Karubi, onion, rice]}
  - name: kitchen
    kitchen: home
    expect:
      errors: 0
      level: 2
      diagnostics:
        exclude: [aliasCandidates]
  - name: raw-karubi
    entry: rawKarubi
    expect:
      diagnostics:
        include:
          - {name: undercooked, args: [Karubi]}
