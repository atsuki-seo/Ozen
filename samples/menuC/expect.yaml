entry: dinner
runs:
  - name: kitchen
    kitchen: home
    expect:
      errors: 0
      level: 2
      diagnostics:
        include:
          - {name: washInserted, args: [board#1, rawMeat]}
        exclude: [unwashedHazard]
      schedule:
        taskCount: {cut@Cabbage: 1, cut@Pork: 1}
        usesKind: [[plate, SoupBowl], [plate, RiceBowl], [plate, FlatPlate]]
        order: [[cut@Pork, cut@Cabbage]]
  - name: kitchen-cooks-2
    kitchen: home
    cooks: 2
    expect:
      errors: 0
      level: 2
      schedule:
        taskCount: {cut@Cabbage: 1}
        cooksUsed: 2
